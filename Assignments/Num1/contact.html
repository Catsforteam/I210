<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
</head>
<body>
    <header>
        <h1>Web Technologies Lab</h1>
    </header>

    <main>
        <h1>Contact Us</h1>
        <form action="formPost.html" method="get">
            <fieldset>
                <legend>Contact Information</legend>
                <label for="fullname">Full Name:</label>
                <input type="text" id="fullname" name="fullname" required>
                <br>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
                <br>
                <label for="phone">Phone:</label>
                <input type="tel" id="phone" name="phone">
                <br>
            </fieldset>
            <br>
            <fieldset>
                <legend>Other Information</legend>
                <label>Are you a student?</label>
                <input type="radio" id="studentYes" name="student" value="Yes" checked>
                <label for="studentYes">Yes</label>
                <input type="radio" id="studentNo" name="student" value="No">
                <label for="studentNo">No</label>
                <br>
                <label for="year">Student Year:</label>
                <select id="year" name="year">
                    <option value="Freshman">Freshman</option>
                    <option value="Sophomore">Sophomore</option>
                    <option value="Junior">Junior</option>
                    <option value="Senior">Senior</option>
                </select>
                <br>
                <label for="enjoyment">Major Enjoyment:</label>
                <input type="range" id="enjoyment" name="enjoyment" min="1" max="5">
                <span>1 = Not at all, 5 = Love it!</span>
                <br>
                <label for="comments">Comments:</label>
                <br>
                <textarea id="comments" name="comments" rows="4" cols="40"></textarea>
                <br>
            </fieldset>
            <br>
            <button type="submit">Submit Form</button>
        </form>
    </main>

    <footer>
        <hr>
        <p>Dr. Jane Smith<br>
        Department of Computer Science<br>
        Tech University, Springfield<br>
        Email: jane.smith@techuniv.edu</p>
        <p>Learn more about HTML at <a href="https://developer.mozilla.org/en-US/docs/Web/HTML">MDN Web Docs</a>.</p>
    </footer>
</body>
</html>
